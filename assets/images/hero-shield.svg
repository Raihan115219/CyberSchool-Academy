<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 620" fill="none" role="img" aria-labelledby="t d">
  <title id="t">Animated cybersecurity shield</title>
  <desc id="d">A glowing blue shield with circuit-board traces stands on a holographic platform, connected to a network of nodes.</desc>
  <style>
    .float   { animation: float 6s ease-in-out infinite; }
    .pulse   { stroke-dasharray: 9 111; stroke-dashoffset: 10; animation: flow 3.2s linear infinite; }
    .p2 { animation-delay: .6s; } .p3 { animation-delay: 1.2s; } .p4 { animation-delay: 1.8s; } .p5 { animation-delay: 2.4s; }
    .node    { transform-box: fill-box; transform-origin: center; animation: beat 3.2s ease-in-out infinite; }
    .n2 { animation-delay: .6s; } .n3 { animation-delay: 1.2s; } .n4 { animation-delay: 1.8s; } .n5 { animation-delay: 2.4s; }
    .spin    { animation: spin 14s linear infinite; }
    .spin-r  { animation: spin-r 22s linear infinite; }
    .link    { stroke-dasharray: 3 7; animation: march 2.4s linear infinite; }
    .twinkle { animation: twinkle 4s ease-in-out infinite; }
    .tw2 { animation-delay: 1s; } .tw3 { animation-delay: 2s; } .tw4 { animation-delay: 3s; }
    .breathe { animation: breathe 6s ease-in-out infinite; }
    .scan    { animation: scan 5s ease-in-out infinite; }

    @keyframes float   { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    @keyframes flow    { to { stroke-dashoffset: -110; } }
    @keyframes beat    { 0%, 70%, 100% { transform: scale(1); } 80% { transform: scale(1.25); } }
    /* offsets are whole multiples of each dash pattern so the loop is seamless */
    @keyframes spin    { to { stroke-dashoffset: -312; } }
    @keyframes spin-r  { to { stroke-dashoffset: 280; } }
    @keyframes march   { to { stroke-dashoffset: -20; } }
    @keyframes twinkle { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
    @keyframes breathe { 0%, 100% { opacity: .55; } 50% { opacity: .9; } }
    @keyframes scan    { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: .55; } 85% { opacity: .55; } 100% { transform: translateY(300px); opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .pulse { stroke-dasharray: none; opacity: 0; }
    }
  </style>

  <defs>
    <linearGradient id="rim" x1="148" y1="0" x2="492" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B9F0FF"/>
      <stop offset=".22" stop-color="#5BB8EC"/>
      <stop offset=".55" stop-color="#1B4A85"/>
      <stop offset=".85" stop-color="#2F7FC4"/>
      <stop offset="1" stop-color="#8ADFFF"/>
    </linearGradient>
    <radialGradient id="face" cx="44%" cy="34%" r="70%">
      <stop offset="0" stop-color="#1E5687"/>
      <stop offset=".45" stop-color="#0F2D52"/>
      <stop offset="1" stop-color="#071428"/>
    </radialGradient>
    <linearGradient id="edge" x1="160" y1="460" x2="480" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A3FF5F"/>
      <stop offset=".45" stop-color="#22C8F5"/>
      <stop offset="1" stop-color="#7FDBFF"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="520" x2="0" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22C8F5" stop-opacity=".32"/>
      <stop offset="1" stop-color="#22C8F5" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="diskTop" x1="0" y1="486" x2="0" y2="554" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#123459"/>
      <stop offset="1" stop-color="#06101F"/>
    </linearGradient>
    <linearGradient id="diskSide" x1="0" y1="520" x2="0" y2="548" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0C2340"/>
      <stop offset="1" stop-color="#040A14"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22C8F5" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#22C8F5" stop-opacity=".12"/>
      <stop offset="1" stop-color="#22C8F5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#38BDF8" stop-opacity=".28"/>
      <stop offset=".6" stop-color="#2563EB" stop-opacity=".08"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scanline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22C8F5" stop-opacity="0"/>
      <stop offset=".5" stop-color="#9BEBFF" stop-opacity=".8"/>
      <stop offset="1" stop-color="#22C8F5" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>

    <path id="shieldOuter" d="M320 60C372 88 432 102 492 106V262C492 366 420 434 320 478C220 434 148 366 148 262V106C208 102 268 88 320 60Z"/>
    <path id="shieldInner" d="M320 92C366 116 418 128 466 131V262C466 352 404 410 320 449C236 410 174 352 174 262V131C222 128 274 116 320 92Z"/>
    <clipPath id="faceClip"><use href="#shieldInner"/></clipPath>
  </defs>

  <!-- Ambient aura -->
  <ellipse cx="320" cy="290" rx="300" ry="270" fill="url(#aura)"/>

  <!-- Network links to the floating panels -->
  <g stroke="#38BDF8" stroke-opacity=".55" stroke-width="1.4">
    <path class="link" d="M150 170H96L70 140"/>
    <path class="link" d="M150 300H110L80 330"/>
    <path class="link" d="M490 160H548L572 128"/>
    <path class="link" d="M490 300H540L568 330"/>
    <path class="link" d="M320 60V28H420"/>
    <path class="link" d="M200 470L120 520H60"/>
    <path class="link" d="M440 470L520 520H590"/>
  </g>
  <g fill="#22C8F5">
    <circle class="twinkle" cx="70" cy="140" r="3.5"/>
    <circle class="twinkle tw2" cx="80" cy="330" r="3.5"/>
    <circle class="twinkle tw3" cx="572" cy="128" r="3.5"/>
    <circle class="twinkle tw4" cx="568" cy="330" r="3.5"/>
    <circle class="twinkle tw2" cx="420" cy="28" r="3"/>
  </g>
  <g fill="#A3FF5F">
    <circle class="twinkle tw3" cx="60" cy="520" r="3"/>
    <circle class="twinkle" cx="590" cy="520" r="3"/>
    <circle class="twinkle tw4" cx="604" cy="230" r="2.5"/>
    <circle class="twinkle tw2" cx="36" cy="236" r="2.5"/>
  </g>
  <g fill="#9BEBFF">
    <circle class="twinkle tw4" cx="250" cy="40" r="1.8"/>
    <circle class="twinkle" cx="520" cy="60" r="1.6"/>
    <circle class="twinkle tw3" cx="110" cy="80" r="1.6"/>
    <circle class="twinkle tw2" cx="610" cy="420" r="1.8"/>
    <circle class="twinkle" cx="30" cy="420" r="1.6"/>
  </g>

  <!-- Holographic platform -->
  <g>
    <ellipse cx="320" cy="526" rx="290" ry="62" stroke="#22C8F5" stroke-opacity=".18" stroke-width="1"/>
    <ellipse class="spin-r" cx="320" cy="526" rx="250" ry="52" stroke="#22C8F5" stroke-opacity=".45" stroke-width="1.5" stroke-dasharray="2 12"/>
    <ellipse cx="320" cy="526" rx="230" ry="60" fill="url(#halo)" opacity=".7"/>
    <path d="M155 520A165 34 0 0 0 485 520V542A165 34 0 0 1 155 542Z" fill="url(#diskSide)"/>
    <path d="M155 542A165 34 0 0 0 485 542" stroke="#22C8F5" stroke-opacity=".35" stroke-width="1.5"/>
    <ellipse cx="320" cy="520" rx="165" ry="34" fill="url(#diskTop)" stroke="#38BDF8" stroke-opacity=".75" stroke-width="2"/>
    <ellipse class="spin" cx="320" cy="520" rx="132" ry="26" stroke="#22C8F5" stroke-opacity=".8" stroke-width="2" stroke-dasharray="40 16 6 16"/>
    <ellipse cx="320" cy="520" rx="98" ry="19" stroke="#22C8F5" stroke-opacity=".45" stroke-width="1"/>
    <ellipse class="breathe" cx="320" cy="520" rx="70" ry="13" stroke="#A3FF5F" stroke-width="2.5" filter="url(#glow)"/>
    <ellipse cx="320" cy="520" rx="34" ry="6.5" fill="#22C8F5" opacity=".75" filter="url(#glow)"/>
    <path class="breathe" d="M150 528A170 38 0 0 0 490 528" stroke="#A3FF5F" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)"/>
  </g>

  <!-- Light beam from the platform -->
  <path d="M250 520L268 270H372L390 520Z" fill="url(#beam)"/>

  <!-- Shield (floats) -->
  <g class="float">
    <!-- soft back-glow -->
    <use href="#shieldOuter" stroke="#22C8F5" stroke-width="14" stroke-opacity=".35" filter="url(#softGlow)" class="breathe"/>
    <!-- depth / thickness -->
    <use href="#shieldOuter" transform="translate(9 11)" fill="#06142A" stroke="#123A66" stroke-width="2"/>
    <!-- metallic rim -->
    <use href="#shieldOuter" fill="url(#rim)"/>
    <!-- neon edge -->
    <use href="#shieldOuter" stroke="url(#edge)" stroke-width="3" filter="url(#glow)"/>
    <!-- glass face -->
    <use href="#shieldInner" fill="url(#face)" stroke="#0A1C34" stroke-width="3"/>
    <use href="#shieldInner" stroke="#7FDBFF" stroke-opacity=".55" stroke-width="1.5"/>

    <g clip-path="url(#faceClip)">
      <!-- left-side glass highlight -->
      <path d="M320 92C274 116 222 128 174 131V262C174 352 236 410 320 449Z" fill="#FFFFFF" fill-opacity=".05"/>
      <!-- fine circuit grid -->
      <g stroke="#38BDF8" stroke-opacity=".08" stroke-width="1">
        <path d="M174 170H466M174 210H466M174 250H466M174 290H466M174 330H466M174 370H466M174 410H466"/>
        <path d="M200 92V460M240 92V460M280 92V460M360 92V460M400 92V460M440 92V460"/>
      </g>
      <!-- scan line -->
      <rect class="scan" x="174" y="110" width="292" height="3" fill="url(#scanline)"/>
    </g>

    <!-- circuit traces -->
    <g stroke="#22C8F5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
      <path d="M320 420V198"/>
      <path d="M304 410V318L262 276V238"/>
      <path d="M288 398V352L224 288V272"/>
      <path d="M336 410V318L378 276V238"/>
      <path d="M352 398V352L416 288V272"/>
    </g>
    <!-- data pulses travelling up the traces -->
    <g stroke="#A3FF5F" stroke-width="5" stroke-linecap="round" fill="none">
      <path class="pulse" pathLength="100" d="M320 420V198"/>
      <path class="pulse p2" pathLength="100" d="M304 410V318L262 276V238"/>
      <path class="pulse p3" pathLength="100" d="M288 398V352L224 288V272"/>
      <path class="pulse p4" pathLength="100" d="M336 410V318L378 276V238"/>
      <path class="pulse p5" pathLength="100" d="M352 398V352L416 288V272"/>
    </g>
    <!-- terminal nodes -->
    <g fill="#0A1E38" stroke="#22C8F5" stroke-width="4" filter="url(#glow)">
      <circle class="node" cx="320" cy="186" r="11"/>
      <circle class="node n2" cx="262" cy="227" r="10"/>
      <circle class="node n3" cx="224" cy="262" r="9"/>
      <circle class="node n4" cx="378" cy="227" r="10"/>
      <circle class="node n5" cx="416" cy="262" r="9"/>
    </g>
    <g fill="#A3FF5F">
      <circle cx="320" cy="186" r="3.5"/>
      <circle cx="262" cy="227" r="3"/>
      <circle cx="224" cy="262" r="3"/>
      <circle cx="378" cy="227" r="3"/>
      <circle cx="416" cy="262" r="3"/>
    </g>
  </g>
</svg>
